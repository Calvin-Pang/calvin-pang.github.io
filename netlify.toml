[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.1.4"

[context.production.environment]
  JEKYLL_ENV = "production"

[context.deploy-preview]
  command = "bundle exec jekyll build"

[context.branch-deploy]
  command = "bundle exec jekyll build"
